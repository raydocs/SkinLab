<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SkinLab</title>
  <desc id="desc">A standardized photo becomes a baseline, then repeated check-ins form a reliable 28-day skin trend.</desc>
  <rect width="1200" height="420" rx="30" fill="#F7F2F4"/>
  <circle cx="1140" cy="-20" r="230" fill="#E8D9E5"/>
  <circle cx="50" cy="430" r="220" fill="#DDE9E2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="60" y="60" fill="#845F78" font-size="16" font-weight="700" letter-spacing="3">STANDARDIZE · TRACK · COMPARE</text>
    <text x="57" y="153" fill="#312930" font-size="78" font-weight="740">SkinLab</text>
    <text x="61" y="201" fill="#756771" font-size="23">让护肤变化有基线、有可靠性，也有时间。</text>
    <g transform="translate(60 260)">
      <rect width="124" height="50" rx="25" fill="#A97894"/>
      <text x="30" y="31" fill="#FFFFFF" font-size="15" font-weight="700">DAY 0</text>
      <path d="M124 25 H214" stroke="#B7A8B2" stroke-width="3"/>
      <rect x="214" width="124" height="50" rx="25" fill="#E9D9E2"/>
      <text x="242" y="31" fill="#6A5061" font-size="15" font-weight="700">CHECK-IN</text>
      <path d="M338 25 H428" stroke="#B7A8B2" stroke-width="3"/>
      <rect x="428" width="124" height="50" rx="25" fill="#6E907D"/>
      <text x="458" y="31" fill="#FFFFFF" font-size="15" font-weight="700">DAY 28</text>
    </g>
    <g transform="translate(702 54)">
      <rect width="430" height="308" rx="24" fill="#FFFFFF" opacity=".92"/>
      <text x="28" y="40" fill="#8B7A85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">TRACKING / RELIABILITY</text>
      <line x1="28" y1="65" x2="402" y2="65" stroke="#E8DEE4"/>
      <g transform="translate(28 88)">
        <rect width="122" height="138" rx="16" fill="#F1E7ED"/>
        <ellipse cx="61" cy="67" rx="37" ry="48" fill="none" stroke="#A97894" stroke-width="3"/>
        <path d="M61 23 V112 M25 67 H97" stroke="#C5A9BA" stroke-width="2" stroke-dasharray="4 5"/>
        <text x="27" y="126" fill="#765D6C" font-size="13">光线 · 角度 · 清晰度</text>
      </g>
      <g transform="translate(176 91)">
        <line x1="0" y1="133" x2="215" y2="133" stroke="#D6CCD2"/>
        <line x1="0" y1="12" x2="0" y2="133" stroke="#D6CCD2"/>
        <path d="M0 106 C38 100 48 73 82 80 S128 48 160 55 S192 29 215 34" fill="none" stroke="#6E907D" stroke-width="5" stroke-linecap="round"/>
        <circle cx="0" cy="106" r="6" fill="#6E907D"/>
        <circle cx="82" cy="80" r="6" fill="#6E907D"/>
        <circle cx="160" cy="55" r="6" fill="#6E907D"/>
        <circle cx="215" cy="34" r="6" fill="#6E907D"/>
        <text x="0" y="160" fill="#8B7A85" font-size="13">同条件复拍 → 可解释趋势</text>
      </g>
      <text x="28" y="274" fill="#9A6579" font-size="14">PHOTO UPLOAD REQUIRES EXPLICIT AI ANALYSIS ACTION</text>
    </g>
  </g>
</svg>
